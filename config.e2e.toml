[paths]
data_dir = "tests/mock_data"
generated_dir = "tests/e2e_generated"
images_dir = "tests/mock_data/images"
ground_truth_brutos_dir = "tests/mock_data/ground_truth_brutos"
segmentacoes_brutas_dir = "tests/e2e_generated/segmentacoes_brutas"
segmentacoes_binarizadas_dir = "tests/e2e_generated/segmentacoes_binarizadas"
ground_truth_binarizada_dir = "tests/e2e_generated/ground_truth_binarizada"
evaluation_dir = "tests/e2e_generated/evaluation"
indice_file = "tests/mock_data/Indice.xlsx"
sqlite_file = "tests/e2e_generated/bufalos-e2e.sqlite3"

[execution]
num_execucoes = 3

[analysis.segmentacao_bruta]
execucao_escolhida = 1
cenario_ideal_tags_permitidas = ["ocluido"]

[analysis.segmentacao_binarizada]
execucao_escolhida = 1
cenario_ideal_tags_permitidas = ["ocluido"]

[analysis.validacao_final]
cenario_base = "apenas_ok"
top_n_modelos = 3
acceptance_rule = "all_metrics"
iou_min = 0.97
precision_min = 0.99
recall_min = 0.985
area_similarity_min = 0.99
perimetro_similarity_min = 0.96

[binarization]
threshold = 127
ground_truth_strategy = "GroundTruthLimiarGlobal"
segmentacao_strategies = [
    "GaussianaOpeningBaixa",
    "GaussianaOpeningAlta",
    "LimiarFixoBaixa",
    "LimiarFixoAlta",
    "OtsuOpeningBaixa",
    "OtsuOpeningAlta",
    "HistereseClosingBaixa",
    "HistereseClosingAlta",
]

[models]
u2netp = "cpu"

[evaluation.parallelism]
enabled = false
executor = "process"
max_workers = 1
batch_size = 4
